name: ROS

on:
  pull_request:
  push:
  workflow_dispatch:
    
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout code
        uses: actions/checkout@v5
      -
        name: Test
        run: |
          docker build -t $GITHUB_REPOSITORY -f ./.devcontainer/desktop/Dockerfile .
          docker run -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE -w $GITHUB_WORKSPACE $GITHUB_REPOSITORY \
          bash -c "export BUILD_TYPE=Release && \
            ./setup.sh && \
            ./build.sh && \
            ./test.sh \
          "
  lint:
    name: ament_${{ matrix.linter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
          linter: [cppcheck, cpplint, uncrustify, lint_cmake, xmllint, flake8, pep257]
    steps:
      - 
        name: Checkout code
        uses: actions/checkout@v5
      -
        name: Run linter
        run: |
          docker build -t $GITHUB_REPOSITORY -f ./.devcontainer/desktop/Dockerfile .
          docker run -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE -w $GITHUB_WORKSPACE $GITHUB_REPOSITORY \
          bash -c "
          ./setup.sh --no-deps \
          && ament_${{ matrix.linter }} src/
          "
